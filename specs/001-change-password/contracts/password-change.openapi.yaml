openapi: 3.0.3
info:
  title: Password Change API
  version: 1.0.0
  description: Contract for authenticated password-change operations.
paths:
  /v1/account/password/change:
    post:
      summary: Change the authenticated user password
      operationId: changePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordChangeSuccess'
        '400':
          description: Password validation or payload-format failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordChangeError'
              examples:
                malformedPayload:
                  value:
                    code: WRONG_PASSWORD_FORMAT
                    message: Request payload is invalid.
                duplicate:
                  value:
                    code: DUPLICATE_PASSWORD_GIVEN
                    message: New password must differ from current password.
                format:
                  value:
                    code: WRONG_PASSWORD_FORMAT
                    message: Password does not meet required format.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordChangeError'
              example:
                code: PASSWORD_CHANGE_UNAUTHORIZED
                message: Authentication is required.
        '409':
          description: Concurrent password-change conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordChangeError'
              example:
                code: PASSWORD_CHANGE_CONFLICT
                message: Concurrent password change conflict.
        '429':
          description: Request throttled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordChangeError'
              example:
                code: PASSWORD_CHANGE_THROTTLED
                message: Too many failed attempts. Retry later.
                retryAfterSeconds: 30
        '503':
          description: Temporary backend failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordChangeError'
              example:
                code: PASSWORD_CHANGE_TEMPORARY_FAILURE
                message: Temporary failure. Retry again.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      description: Backend payload for password change. confirmPassword is intentionally excluded because mismatch validation is frontend-only.
      required:
        - newPassword
      properties:
        newPassword:
          type: string
          minLength: 8
          description: New password value after frontend prevalidation; malformed or non-string payloads map to WRONG_PASSWORD_FORMAT.
    PasswordChangeSuccess:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - PASSWORD_CHANGE_SUCCESS
        message:
          type: string
    PasswordChangeError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - DUPLICATE_PASSWORD_GIVEN
            - WRONG_PASSWORD_FORMAT
            - PASSWORD_CHANGE_UNAUTHORIZED
            - PASSWORD_CHANGE_CONFLICT
            - PASSWORD_CHANGE_THROTTLED
            - PASSWORD_CHANGE_TEMPORARY_FAILURE
        message:
          type: string
        retryAfterSeconds:
          type: integer
          minimum: 1
